[pytest]
# The rules are tests run against one model: arch_harness.checks.run_rules(model.json) runs them (python -m arch_harness hook after-step)
python_files = rule_*.py
addopts = -p no:cacheprovider
# element ids name rooms as the brief wrote them (Büro, not B\xfcro): the film and the reports match on them
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
markers =
    rule(id, kind, from_brief=False, label=''): a design rule; label: what a viewer reads, with {parameter} filled from the model; kind is code, geometry or brief; the docstring cites its source; from_brief=True: it checks a statement the brief may leave out, and with none it is not run (not reported as unconfirmed)
